# Verificacoes locais executadas antes de cada commit.
# Os comandos usam o Python da .venv para nao depender do Python do sistema.
repos:
  - repo: local
    hooks:
      - id: pylint
        name: pylint (src)
        entry: .venv/Scripts/python.exe -m pylint src
        language: system
        files: ^src/
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: .venv/Scripts/python.exe -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
      - id: radon
        name: radon cc (somente leitura)
        entry: .venv/Scripts/python.exe -m radon cc src -a -s
        language: system
        pass_filenames: false
        always_run: true
