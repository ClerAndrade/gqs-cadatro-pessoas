<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250">
  <style>
    .box { fill: #f4f7fa; stroke: #35526b; stroke-width: 1.5; rx: 6; }
    .iface { fill: #e8f1e4; stroke: #3d6b34; stroke-width: 1.5; rx: 6; }
    .txt { font-family: Calibri, sans-serif; font-size: 13px; fill: #222; text-anchor: middle; }
    .tit { font-family: Calibri, sans-serif; font-size: 11px; fill: #555; text-anchor: middle; }
    .seta { stroke: #35526b; stroke-width: 1.5; fill: none; marker-end: url(#ponta); }
  </style>
  <defs>
    <marker id="ponta" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#35526b"/>
    </marker>
  </defs>
  <rect class="box" x="20" y="35" width="150" height="60"/>
  <text class="txt" x="95" y="60">src/main.py</text>
  <text class="tit" x="95" y="78">menu e variáveis de ambiente</text>
  <rect class="box" x="230" y="35" width="180" height="60"/>
  <text class="txt" x="320" y="60">CadastroPessoas</text>
  <text class="tit" x="320" y="78">regras de negócio</text>
  <rect class="iface" x="470" y="35" width="220" height="60"/>
  <text class="txt" x="580" y="60">RepositorioPessoas</text>
  <text class="tit" x="580" y="78">contrato abstrato</text>
  <rect class="box" x="400" y="165" width="160" height="55"/>
  <text class="txt" x="480" y="188">RepositorioMemoria</text>
  <text class="tit" x="480" y="205">padrão do menu</text>
  <rect class="box" x="600" y="165" width="140" height="55"/>
  <text class="txt" x="670" y="188">RepositorioMySQL</text>
  <text class="tit" x="670" y="205">DAO com SQL parametrizado</text>
  <path class="seta" d="M170,65 L230,65"/>
  <path class="seta" d="M410,65 L470,65"/>
  <path class="seta" d="M540,95 Q500,130 480,165"/>
  <path class="seta" d="M620,95 Q650,130 670,165"/>
  <rect x="230" y="165" width="130" height="55" fill="#fff" stroke="#999" stroke-dasharray="4 3"/>
  <text class="txt" x="295" y="188">Pessoa</text>
  <text class="tit" x="295" y="205">entidade validada</text>
